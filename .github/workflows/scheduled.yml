name: Mantenimiento programado

on:
  schedule:
    # Cada 6 horas: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance:
    name: Actualizar dependencias y formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - run: npm ci

      - name: Actualizar dependencias menores
        run: npm update --save

      - name: Corregir vulnerabilidades de parches
        run: npm audit fix || true

      - name: Verificar build
        run: npm run build

      - name: Commit y push a main si hay cambios
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "chore: mantenimiento automático programado"
            git push origin main
          else
            echo "Sin cambios que commitear."
          fi
